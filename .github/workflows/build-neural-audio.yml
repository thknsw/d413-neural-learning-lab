name: Build neural audio and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-d413
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify the included recordings
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path("curriculum.json").read_text())
          lessons = [lesson["id"] for section in data["sections"] for lesson in section["lessons"]]
          tracks = {f"audio/{voice}/{lesson}.mp3" for voice in ("jenny", "andrew", "sonia") for lesson in lessons}
          manifest = json.loads(Path("audio/manifest.json").read_text())
          assert len(tracks) == 180 and tracks == set(manifest["audioFiles"])
          for track in tracks:
              assert Path(track).stat().st_size > 5000, track
      - name: Assemble the published website
        shell: bash
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp -r audio public/audio
          touch public/.nojekyll
      - name: Save the complete site and MP3s as a downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: D413-Neural-Audio-Lab-Offline
          path: public/
          retention-days: 30
      - name: Upload GitHub Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
